name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Release
        uses: taiki-e/create-gh-release-action@v1
        with:
          changelog: CHANGELOG.md
          token: ${{ secrets.GITHUB_TOKEN }}
          allow-missing-changelog: true

  upload-assets:
    name: Build & Upload (${{ matrix.target }})
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          # macOS
          - target: x86_64-apple-darwin
            os: macos-13
          - target: aarch64-apple-darwin
            os: macos-14
          # Windows
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross Toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-unknown-linux-gnu'
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build Binary
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-musl" ] || [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package & Upload Binary Assets
        shell: bash
        run: |
          BIN_NAME="dicom-transformer"
          TAG_NAME="${{ github.ref_name }}"
          TARGET="${{ matrix.target }}"
          ARCHIVE_NAME="${BIN_NAME}-${TAG_NAME}-${TARGET}"
          
          mkdir -p dist
          
          if [ "${{ runner.os }}" = "Windows" ]; then
            ZIP_FILE="dist/${ARCHIVE_NAME}.zip"
            powershell Compress-Archive -Path "target/${TARGET}/release/${BIN_NAME}.exe" -DestinationPath "${ZIP_FILE}"
            powershell "(Get-FileHash -Algorithm SHA256 '${ZIP_FILE}').Hash.ToLower() + '  ${ARCHIVE_NAME}.zip'" > "${ZIP_FILE}.sha256"
            gh release upload "${TAG_NAME}" "${ZIP_FILE}" "${ZIP_FILE}.sha256" --clobber
          else
            TAR_FILE="dist/${ARCHIVE_NAME}.tar.gz"
            tar -czvf "${TAR_FILE}" -C "target/${TARGET}/release" "${BIN_NAME}"
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "${TAR_FILE}" > "${TAR_FILE}.sha256"
            else
              shasum -a 256 "${TAR_FILE}" > "${TAR_FILE}.sha256"
            fi
            gh release upload "${TAG_NAME}" "${TAR_FILE}" "${TAR_FILE}.sha256" --clobber
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
