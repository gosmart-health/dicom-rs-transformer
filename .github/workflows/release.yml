name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-binaries:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          # macOS
          - target: aarch64-apple-darwin
            os: macos-14
          # Windows
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross Toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-unknown-linux-gnu'
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build Binary
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-musl" ] || [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package Binary Asset
        shell: bash
        run: |
          BIN_NAME="dicom-transformer"
          TAG_NAME="${{ github.ref_name }}"
          TARGET="${{ matrix.target }}"
          ARCHIVE_NAME="${BIN_NAME}-${TAG_NAME}-${TARGET}"
          
          mkdir -p dist
          
          if [ "${{ runner.os }}" = "Windows" ]; then
            ZIP_FILE="dist/${ARCHIVE_NAME}.zip"
            powershell Compress-Archive -Path "target/${TARGET}/release/${BIN_NAME}.exe" -DestinationPath "${ZIP_FILE}"
            powershell "(Get-FileHash -Algorithm SHA256 '${ZIP_FILE}').Hash.ToLower() + '  ${ARCHIVE_NAME}.zip'" > "${ZIP_FILE}.sha256"
          else
            TAR_FILE="dist/${ARCHIVE_NAME}.tar.gz"
            tar -czvf "${TAR_FILE}" -C "target/${TARGET}/release" "${BIN_NAME}"
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "${TAR_FILE}" > "${TAR_FILE}.sha256"
            else
              shasum -a 256 "${TAR_FILE}" > "${TAR_FILE}.sha256"
            fi
          fi

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: dist/*
          retention-days: 1

  create-release:
    name: Create GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Binary Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-assets
          merge-multiple: true

      - name: Extract Release Notes from CHANGELOG.md
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          
          awk -v ver="${VERSION}" '
            $0 ~ "^## \\[" ver "\\]" { flag=1; next }
            $0 ~ "^## \\[" && flag { flag=0 }
            flag { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "Release ${TAG}" > RELEASE_NOTES.md
          fi

      - name: Create Release with All Binary Assets
        shell: bash
        run: |
          gh release create "${{ github.ref_name }}" all-assets/* --title "${{ github.ref_name }}" --notes-file RELEASE_NOTES.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
